name: Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JDK_JAVAC_OPTIONS: '-Xlint:-module'

jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up JDK 25.0.2
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '25.0.2'
      - name: Install desktop test runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libgtk-3-0 libasound2 xvfb xauth
      - name: Check packaging and CI configuration
        run: python3 src/test/packaging_test.py
      - name: Run regression and desktop tests
        run: xvfb-run --auto-servernum ./gradlew :test :desktopTest --console=plain
      - name: Upload test results and desktop renders
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PurityWallet-linux-test-results
          path: |
            build/reports/tests/**
            build/test-results/**
            build/qa/**
          if-no-files-found: ignore
