# Modified for PurityWallet on 2026-10-27; see LICENSE and NOTICE.
name: Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - codex/puritywallet-windows-1.0.0b

permissions:
  contents: read

env:
  JDK_JAVAC_OPTIONS: '-Xlint:-module'
  PYTHONUTF8: '1'

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
      - name: Set up JDK 25.0.2
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '25.0.2'
          architecture: x64
      - name: Check Windows packaging tools and release metadata
        run: |
          $env:PATH = "$env:WIX\bin;$env:PATH"
          "$env:WIX\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Get-Command candle.exe, light.exe
          $releaseVersion = [regex]::Match((Get-Content build.gradle -Raw), "(?m)^version = '([^']+)'").Groups[1].Value
          if (-not $releaseVersion) { throw 'No project release version found' }
          "RELEASE_VERSION=$releaseVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          python src/test/packaging_test.py
      - name: Test and build Windows MSI
        run: ./gradlew :test :jpackage
      - name: Prepare versioned Windows installer
        run: |
          $msis = @(Get-ChildItem build/jpackage -Filter *.msi)
          if ($msis.Count -ne 1) { throw 'Expected exactly one MSI installer' }
          $out = New-Item -ItemType Directory -Force build/windows-release
          $target = Join-Path $out "puritywallet-${env:RELEASE_VERSION}-windows-x64.msi"
          Copy-Item $msis[0].FullName $target
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($target))" | Set-Content "$target.sha256" -Encoding ascii
      - name: Install MSI and check the installed application version
        run: |
          $installer = Get-ChildItem build/windows-release -Filter *.msi | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'puritywallet-installed'
          $msiLog = Join-Path $env:RUNNER_TEMP 'puritywallet-msi.log'
          $result = Start-Process msiexec.exe -ArgumentList "/i `"$($installer.FullName)`" /qn /norestart INSTALLDIR=`"$installDir`" /L*v `"$msiLog`"" -Wait -PassThru
          if ($result.ExitCode -notin @(0, 3010)) {
            Get-Content $msiLog -Tail 80
            throw "MSI installation failed: $($result.ExitCode)"
          }
          $exe = Join-Path $installDir 'puritywallet.exe'
          if (-not (Test-Path $exe)) { throw 'Installed puritywallet.exe was not found' }
          $versionLog = Join-Path $env:RUNNER_TEMP 'puritywallet-version.txt'
          $errorLog = Join-Path $env:RUNNER_TEMP 'puritywallet-version-error.txt'
          $app = Start-Process $exe -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput $versionLog -RedirectStandardError $errorLog
          $actual = (Get-Content $versionLog -Raw).Trim()
          if ($app.ExitCode -ne 0 -or $actual -ne "PurityWallet $env:RELEASE_VERSION") {
            Get-Content $errorLog
            throw "Installed application version check failed: $actual"
          }
          Write-Output $actual
      - name: Upload Windows installer and SHA-256
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PurityWallet-${{ env.RELEASE_VERSION }}-windows-x64
          path: build/windows-release/*
          if-no-files-found: error
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PurityWallet-windows-diagnostics
          path: |
            build/reports/**
            ${{ runner.temp }}/puritywallet-msi.log
            ${{ runner.temp }}/puritywallet-version*.txt
          if-no-files-found: ignore
